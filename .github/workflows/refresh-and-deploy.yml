name: Refresh data and deploy site
on:
  schedule:
    - cron: "0 12 * * 1"     # weekly, Mondays
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: pages-deploy
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Stamp run
        if: github.event_name != 'push'
        run: echo "=== run ${{ github.run_id }} $(date -u) ===" > data/last_refresh.log
      - name: Refresh substations (non-fatal)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          python pipelines/substations.py 2>&1 | tee -a data/last_refresh.log
      - name: Refresh WARN closure leads (non-fatal)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          python pipelines/warn.py 2>&1 | tee -a data/last_refresh.log
      - name: Build site
        env:
          WS_MEMBERS_TOKEN: ${{ secrets.WS_MEMBERS_TOKEN }}
        run: python site/build.py --base-url "${{ vars.BASE_URL || 'https://dgoikhman.github.io/wattscore' }}"
      - name: Diag snapshot (workspace truth to diag branch)
        if: github.event_name != 'push'
        run: |
          git config user.name "ws-diag"; git config user.email "bot@users.noreply.github.com"
          echo "workspace at $(date -u):" > data/DIAG.txt
          ls -la data/ >> data/DIAG.txt
          echo "--- log head ---" >> data/DIAG.txt; head -5 data/last_refresh.log >> data/DIAG.txt 2>&1
          echo "--- log wc ---" >> data/DIAG.txt; wc -l data/last_refresh.log >> data/DIAG.txt 2>&1
          echo "--- git status ---" >> data/DIAG.txt; git status --short >> data/DIAG.txt
          echo "--- head commit ---" >> data/DIAG.txt; git log --oneline -2 >> data/DIAG.txt
          git checkout -B diag
          git add -f data/ || true
          git commit -m "diag snapshot" || true
          git push -f origin diag || echo "diag push failed"
          git checkout -
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Commit refreshed public data
        run: |
          git config user.name "ws-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/last_refresh.log data/leads.csv data/substations.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: refresh [skip ci]"
          git push origin HEAD:main || (git fetch origin && git rebase origin/main && git push origin HEAD:main)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
